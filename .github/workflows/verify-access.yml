name: Verificar acesso de configuração
on:
  push:
    paths:
      - .github/workflows/verify-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar disponibilidade do segredo
        env:
          CHECK_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$CHECK_TOKEN" ]; then
            echo "::error title=GH_PAT indisponível::O segredo GH_PAT está vazio ou não está disponível para este repositório."
            exit 1
          fi
          echo "::notice title=GH_PAT disponível::O workflow consegue acessar o segredo GH_PAT. Seu conteúdo não foi exibido."
